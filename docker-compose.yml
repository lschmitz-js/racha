services:
  racha:
    build: .
    image: racha:latest
    container_name: racha
    restart: unless-stopped
    # The app is only reachable through Caddy/Cloudflare on 80/443 — the origin
    # port is NOT published to the host, so nobody can bypass TLS + the edge by
    # hitting http://<origin-ip>:8080 directly. Re-add a `ports:` mapping only
    # for temporary local debugging, never on the public host.
    expose:
      - "8080"
    volumes:
      - ./data:/data
    environment:
      # Required for a public deployment: the shared admin token that gates every
      # write endpoint. Set it in a local .env file (RACHA_TOKEN=<long-random>).
      # `:?` makes `docker compose up` fail fast if it is unset, so the app can
      # never launch wide-open by accident. Generate one with:
      #   openssl rand -base64 24
      RACHA_TOKEN: ${RACHA_TOKEN:?set a strong RACHA_TOKEN in .env for a public deploy}
      DB_PATH: /data/racha.db

  caddy:
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - racha

volumes:
  caddy_data:
  caddy_config:

# To enable continuous backup to S3, run a litestream sidecar:
# https://litestream.io/install/
# Sample config in litestream.yml.
